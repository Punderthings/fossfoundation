# SPDX-License-Identifier: Apache-2.0
[project]
name = "fdncheck"
version = "0.1.0"
description = "Check _foundations records against each foundation's own website, with fixed rules, and propose reviewable edits."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[project.scripts]
fdncheck = "fdncheck.cli:main"

[dependency-groups]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
extend-select = ["E731", "I", "UP", "B"]
