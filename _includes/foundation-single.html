  <li>
    <h2>
      <a id="{{ fdn.identifier }}" href="/foundations/{{ fdn.identifier }}">{{ fdn.legalName }}</a>
    </h2>
    {% if fdn.website %}
      <abbr title="{{ site.data.foundations-schema.properties.website.description }}">{{ site.data.foundations-schema.properties.website.title }}</abbr>: <a href="{{ fdn.website }}">{{ fdn.website }}</a><br/>
    {% endif %}
    <abbr title="{{ site.data.foundations-schema.properties.nonprofitStatus.description }}">{{ site.data.foundations-schema.properties.nonprofitStatus.title }}</abbr>: {{ fdn.nonprofitStatus }}<br/>
    {{ fdn.description }}
  </li>
